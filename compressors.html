<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CODENT - Дополнительное оборудование CAD/CAM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="src/codent-logo-light.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/catalog.css">
    <link rel="stylesheet" href="css/reviews.css">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="page-header" class="page-header"></div>
    <div id="products-container" class="products-grid">
        <div class="loading">Загружаем каталог дополнительного оборудования...</div>
    </div>

    <!-- Кнопка корзины -->
    <div class="cart-button-container">
        <button id="cart-button" class="cart-button">
            <span class="cart-icon">🛒</span>
            <span id="cart-count" class="cart-count">0</span>
        </button>
    </div>

    <!-- Модальное окно товара -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <h2 id="modal-product-name"></h2>
                <div class="product-code" id="modal-product-code"></div>
            </div>
            <div class="modal-body">
                <div class="product-main-info">
                    <div class="product-image-container">
                        <img id="modal-product-image" class="product-image" src="" alt="">
                    </div>
                    <div class="product-info">
                        <div class="product-availability" id="modal-product-availability">
                            <span class="availability-icon">✓</span>
                            <span class="availability-text">На складе</span>
                        </div>
                        <div class="product-brand" id="modal-product-brand"></div>
                        <div class="product-price-container" id="modal-product-price"></div>
                        <div class="product-actions">
                            <div class="param-group">
                                <input type="number" id="param-quantity" class="param-quantity" min="1" value="1">
                                <button class="add-to-cart">В корзину</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="product-tabs">
                    <div class="tab-buttons">
                        <button class="tab-button active" data-tab="description">Описание</button>
                        <button class="tab-button" data-tab="characteristics">Характеристики</button>
                    </div>
                    
                    <div class="tab-content">
                        <div class="tab-pane active" id="tab-description">
                            <div class="product-description" id="modal-product-description"></div>
                        </div>
                        <div class="tab-pane" id="tab-characteristics">
                            <div class="specs-list" id="modal-product-specs"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Блок похожих товаров -->
            <div class="similar-products-section" id="similar-products-section">
                <h3 class="similar-products-title">Похожие товары</h3>
                <div class="similar-products-grid" id="similar-products-grid">
                    <!-- Похожие товары будут загружены динамически -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно корзины -->
    <div id="cartModal" class="modal">
        <div class="modal-content cart-modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <h2>Ваша корзина</h2>
            </div>
            <div class="modal-body">
                <div id="cart-items-container" class="cart-items-container">
                    <div class="empty-cart-message">Ваша корзина пуста</div>
                </div>
                <div class="cart-total">
                    <div class="total-row">
                        <span>Итого:</span>
                        <span id="cart-total-price">0 ₽</span>
                    </div>
                    <button id="checkout-button" class="checkout-button">Оформить заказ</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <!-- Подключаем скрипты -->
    <script src="js/api-keys.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/load-components.js"></script>
    <script src="js/auth-state.js"></script>
    <script src="js/reviews.js"></script>
    <script src="js/catalog-firebase.js"></script>
    <script src="js/promotions-manager.js"></script>
    
    <script>
        // Устанавливаем категорию для фильтрации
        window.CATALOG_CATEGORY = 'equipment';
        
        // Устанавливаем заголовок страницы
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof setPageHeader === 'function') {
                setPageHeader('Дополнительное оборудование CAD/CAM', 'Компрессоры и другое вспомогательное оборудование');
            }

            // Инициализируем менеджер промоакций для модального окна
            if (typeof PromotionsManager !== 'undefined') {
                window.promotionsManager = new PromotionsManager();
                // Инициализируем загрузку всех товаров для поиска похожих
                window.promotionsManager.init().then(() => {
                    console.log('PromotionsManager инициализирован для компрессоров');
                    console.log('Всего товаров загружено:', window.promotionsManager.allProducts.length);
                }).catch(error => {
                    console.error('Ошибка инициализации PromotionsManager:', error);
                });
            }
        });
    </script>

    <!-- Модальное окно для увеличения изображений -->
    <div id="imageModal" class="image-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="imageModalClose">&times;</button>
            <img id="imageModalImg" src="" alt="">
        </div>
    </div>
</body>
</html>
