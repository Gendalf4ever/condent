<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Codent - Контакты</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/svg+xml" href="src/codent-logo-light.svg">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/popup.css">
        <link rel="stylesheet" href="css/contacts-page.css">
        <link rel="stylesheet" href="css/responsive.css">
    </head>
    <body>
        
        <!-- Заголовок страницы -->
        <section class="page-header" id="dynamic-page-header">
            <div class="page-header__container">
                <h1 class="page-header__title">Контакты</h1>
            </div>
        </section>

        <!-- Контейнер для карты и контактов -->
        <div class="contacts-page-wrapper">
            <!-- Карта -->
            <div class="map-section">
                <div class="map-container">
                    <div class="map-wrapper">
                        <div style="position:relative;overflow:hidden; width: 100%; height: 100%;">
                            <a href="https://yandex.ru/maps/2/saint-petersburg/?utm_medium=mapframe&utm_source=maps" style="color:#eee;font-size:12px;position:absolute;top:0px;z-index:1;">Санкт‑Петербург</a>
                            <a href="https://yandex.ru/maps/2/saint-petersburg/house/naberezhnaya_reki_smolenki_33/Z0kYdAJlSUIOQFtjfXV1dn9jYg==/?ll=30.255624%2C59.946755&utm_medium=mapframe&utm_source=maps&z=15.59" style="color:#eee;font-size:12px;position:absolute;top:14px;z-index:1;">Набережная реки Смоленки, 33 — Яндекс Карты</a>
                            <iframe 
                                src="https://yandex.ru/map-widget/v1/?ll=30.255624%2C59.946755&mode=search&ol=geo&ouri=ymapsbm1%3A%2F%2Fgeo%3Fdata%3DCgg1NzQzOTA3MRJf0KDQvtGB0YHQuNGPLCDQodCw0L3QutGCLdCf0LXRgtC10YDQsdGD0YDQsywg0L3QsNCx0LXRgNC10LbQvdCw0Y8g0YDQtdC60Lgg0KHQvNC-0LvQtdC90LrQuCwgMzMiCg1oCvJBFQrKb0I%2C&z=15.59" 
                                title="Карта с адресом Codent - Набережная реки Смоленки, 33" 
                                allowfullscreen="true" 
                                frameborder="0"
                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;">
                            </iframe>
                        </div>
                    </div>
                </div>

                <!-- Информационный блок на карте -->
                <div class="map-info-block">
                    <div class="contact-info-item">
                        <div class="contact-label">ЗВОНИТЕ</div>
                        <a href="tel:+79992224498" class="contact-value">+7 999 222-44-98</a>
                    </div>

                    <div class="contact-info-item">
                        <div class="contact-label">ПИШИТЕ</div>
                        <a href="javascript:void(0)" onclick="openContactPopup()" class="contact-value">sale@codent.pro</a>
                    </div>

                    <div class="contact-info-item">
                        <div class="contact-label">ПРИСОЕДИНЯЙТЕСЬ</div>
                        <div class="social-links">
                            <a href="https://www.youtube.com/@CodentPro" target="_blank" class="contact-value social-link">YouTube</a>
                            <span class="social-separator">,</span>
                            <a href="https://t.me/codentpro" target="_blank" class="contact-value social-link">Telegram</a>
                        </div>
                    </div>

                    <div class="contact-info-item">
                        <div class="contact-label">ПРИХОДИТЕ</div>
                        <div class="contact-value">
                            г. Санкт-Петербург,<br>
                            Набережная реки Смоленки, 33
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer и другие компоненты загружаются после -->

        <!-- Firebase SDK -->
        <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
        
        <script src="js/api-keys.js"></script>
        <script src="js/firebase-config.js"></script>
        <script src="js/load-components.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Заголовок страницы не нужен в этом дизайне
                // компоненты загружаются автоматически через initializePage()
            });
        </script>
    </body>
</html>
