<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CODENT.PRO - CAD/CAM системы для профессионалов</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="src/codent-logo-light.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <!-- Компоненты будут загружены автоматически через load-components.js -->
    
    <!-- основной контент -->
    <main class="main-content-wrapper">
        <div class="images-gallery">
            <div class="gallery-image">
                <img src="https://i.ibb.co/Qvz7xTWy/image1.png" alt="image1" border="0">
            </div>
            <div class="gallery-image">
                <img src="https://i.ibb.co/v7xB4Kd/image2.png" alt="image2" border="0">
            </div>
            <div class="gallery-image">
                <img src="https://i.ibb.co/G48kTwFf/image3.png" alt="image3" border="0">
            </div>
            <div class="gallery-image">
                <img src="https://i.ibb.co/PZyYvNrs/image4.png" alt="image4" border="0">
            </div>
            <div class="gallery-image-with-button">
                <div class="gallery-image">
                    <img src="https://i.ibb.co/8DvD2L3h/image5.png" alt="image5" border="0">
                </div>
                <div class="ask-question-container">
                    <button class="ask-question-btn" id="ask-question-btn">Задать вопрос</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <!-- Подключаем скрипты -->
    <script src="js/api-keys.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/load-components.js"></script>
    <script>
        // Дополнительная инициализация для главной страницы
        document.addEventListener('DOMContentLoaded', () => {
            // Установка заголовка для главной страницы
            if (typeof setPageHeader === 'function') {
                setPageHeader('CAD/CAM системы для профессионалов', 'Лучшее цифровое оборудование');
            }
            
            // Добавляем отступ при загрузке хедера
            const checkHeader = setInterval(() => {
                const header = document.querySelector('header');
                if (header) {
                    clearInterval(checkHeader);
                    document.documentElement.style.setProperty(
                        '--header-height', 
                        `${header.offsetHeight}px`
                    );
                }
            }, 100);
            
            // Обработчик кнопки "Задать вопрос"
            const askQuestionBtn = document.getElementById('ask-question-btn');
            if (askQuestionBtn) {
                askQuestionBtn.addEventListener('click', () => {
                    // Открываем попап связи с нами
                    const contactPopup = document.getElementById('contact-popup');
                    if (contactPopup) {
                        contactPopup.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    }
                });
            }
        });
    </script>
</body>
</html>
