<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CODENT.PRO - CAD/CAM системы для профессионалов</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="src/codent-logo-light.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/catalog.css">
    <link rel="stylesheet" href="css/sale-banners.css">
</head>
<body>
    <!-- Компоненты будут загружены автоматически через load-components.js -->
    
    <!-- Видео секция -->
    <div class="video-section-top">
        <div class="video-container">
            <video autoplay loop muted playsinline preload="metadata" poster="">
                <source src="src/vid/Курс по Dolphin Imaging.mp4" type="video/mp4">
                Ваш браузер не поддерживает воспроизведение видео.
            </video>
        </div>
    </div>

    <!-- Блок акций -->
    <section class="promotions-section">
        <div class="promotions-container">
            <h2 class="promotions-title">Акции и скидки</h2>
            <div class="promotions-grid" id="promotions-grid">
                <!-- Товары будут загружены динамически -->
                <div class="promotions-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Загружаем актуальные акции...</span>
                </div>
            </div>
        </div>
    </section>

    <!-- основной контент -->
    <main class="main-content-wrapper">
        <div class="images-gallery">
            <div class="gallery-image">
                <img src="https://i.ibb.co/Qvz7xTWy/image1.png" alt="image1" border="0">
            </div>
            <div class="gallery-image">
                <img src="https://i.ibb.co/v7xB4Kd/image2.png" alt="image2" border="0">
            </div>
            <div class="gallery-image">
                <img src="https://i.ibb.co/G48kTwFf/image3.png" alt="image3" border="0">
            </div>
            <div class="gallery-image">
                <img src="https://i.ibb.co/PZyYvNrs/image4.png" alt="image4" border="0">
            </div>
            <div class="gallery-image-with-button">
                <div class="gallery-image">
                    <img src="https://i.ibb.co/8DvD2L3h/image5.png" alt="image5" border="0">
                </div>
                <div class="ask-question-container">
                    <button class="ask-question-btn" id="ask-question-btn">Задать вопрос</button>
                </div>
            </div>
        </div>
    </main>


    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <!-- Подключаем скрипты -->
    <script src="js/api-keys.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/load-components.js"></script>
    <script src="js/sale-banners.js"></script>
    <script src="js/catalog-firebase.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/promotions-manager.js"></script>
    <script>
        // Дополнительная инициализация для главной страницы
        document.addEventListener('DOMContentLoaded', () => {
            // Установка заголовка для главной страницы
            if (typeof setPageHeader === 'function') {
                setPageHeader('CAD/CAM системы для профессионалов', 'Лучшее цифровое оборудование');
            }
            
            // Обработчик кнопки "Задать вопрос"
            const askQuestionBtn = document.getElementById('ask-question-btn');
            if (askQuestionBtn) {
                askQuestionBtn.addEventListener('click', () => {
                    // Открываем попап связи с нами
                    const contactPopup = document.getElementById('contact-popup');
                    if (contactPopup) {
                        contactPopup.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    }
                });
            }
        });
    </script>

    <!-- Модальное окно товара -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <h2 id="modal-product-name"></h2>
                <div class="product-code" id="modal-product-code"></div>
            </div>
            <div class="modal-body">
                <div class="product-main-info">
                    <div class="product-image-container">
                        <img id="modal-product-image" class="product-image" src="" alt="">
                    </div>
                    <div class="product-info">
                        <div class="product-availability" id="modal-product-availability">
                            <span class="availability-icon">✓</span>
                            <span class="availability-text">На складе</span>
                        </div>
                        <div class="product-brand" id="modal-product-brand"></div>
                        <div class="product-price-container" id="modal-product-price"></div>
                        <div class="product-actions">
                            <div class="param-group">
                                <input type="number" id="param-quantity" class="param-quantity" min="1" value="1">
                                <button class="add-to-cart">В корзину</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="product-tabs">
                    <div class="tab-buttons">
                        <button class="tab-button active" data-tab="description">Описание</button>
                        <button class="tab-button" data-tab="characteristics">Характеристики</button>
                    </div>
                    
                    <div class="tab-content">
                        <div class="tab-pane active" id="tab-description">
                            <div class="product-description" id="modal-product-description"></div>
                        </div>
                        <div class="tab-pane" id="tab-characteristics">
                            <div class="specs-list" id="modal-product-specs"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Блок похожих товаров -->
            <div class="similar-products-section" id="similar-products-section">
                <h3 class="similar-products-title">Похожие товары</h3>
                <div class="similar-products-grid" id="similar-products-grid">
                    <!-- Похожие товары будут загружены динамически -->
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div id="cartModal" class="modal">
        <div class="modal-content cart-modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <h2>Корзина</h2>
            </div>
            <div class="modal-body">
                <div class="cart-items-container" id="cart-items-container">
                    <!-- Товары корзины будут загружены динамически -->
                </div>
                <div class="cart-total" id="cart-total">
                    <strong>Итого: 0 ₽</strong>
                </div>
                <div class="cart-actions">
                    <button class="btn-primary" id="checkout-btn">Оформить заказ</button>
                    <button class="btn-secondary" id="clear-cart-btn">Очистить корзину</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Кнопка корзины -->
    <div class="cart-button-container">
        <button class="cart-button" id="cart-button">
            <div class="cart-icon">🛒</div>
            <div class="cart-count" id="cart-count">0</div>
        </button>
    </div>

    <!-- Модальное окно для увеличения изображений -->
    <div id="imageModal" class="image-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="imageModalClose">&times;</button>
            <img id="imageModalImg" src="" alt="">
        </div>
    </div>
</body>
</html>
