<!DOCTYPE html>
<html>
<head>
    <title>Админка блога</title>
    <link rel="stylesheet" href="css/admin.css">
    <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body>
    <div id="auth-container">
        <form id="login-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
    </div>

    <div id="admin-container" style="display:none;">
        <header>
            <h1>Панель управления</h1>
            <button id="logout">Выйти</button>
            <button id="add-article">+ Новая статья</button>
        </header>
        
        <div id="articles-list"></div>
        
        <div id="editor-modal" class="modal">
            <form id="article-form">
                <input type="hidden" id="article-id">
                <input type="text" id="article-title" placeholder="Заголовок" required>
                <textarea id="article-content" placeholder="Текст статьи"></textarea>
                <input type="file" id="article-image" accept="image/*">
                <button type="submit">Сохранить</button>
            </form>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
