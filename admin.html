<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Админка блога CO[D]ENT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
</head>
<body>
    <!-- Контейнер аутентификации -->
    <div id="auth-container">
        <div class="auth-wrapper">
            <div class="auth-logo">
                <h2>CO[D]ENT</h2>
                <p>Панель управления блогом</p>
            </div>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="admin@codent.pro" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Введите пароль" required>
                </div>
                <button type="submit" class="auth-submit-btn">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </button>
            </form>
        </div>
    </div>

    <!-- Основная панель администрирования -->
    <div id="admin-container" style="display:none;">
        <header class="admin-header">
            <h1>Панель управления CO[D]ENT</h1>
            <p>Добро пожаловать, <span id="user-email"></span></p>
        </header>

        <div class="admin-actions">
            <button id="logout-btn" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Выйти
            </button>
            <button id="add-article-btn" class="add-article-btn">
                <i class="fas fa-plus"></i> Добавить статью
            </button>
        </div>

        <section class="articles-section">
            <h2>Статьи</h2>
            <div id="articles-list" class="articles-list">
                <!-- Статьи будут загружены здесь -->
            </div>
        </section>

        <!-- Модальное окно добавления статьи -->
        <div id="add-article-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Добавить новую статью</h3>
                    <span id="close-add-modal" class="close">&times;</span>
                </div>
                <form id="add-article-form" class="modal-form">
                    <div class="form-group">
                        <label for="article-title">Заголовок статьи</label>
                        <input type="text" id="article-title" placeholder="Введите заголовок" required>
                    </div>

                    <div class="form-group">
                        <label for="article-content">Содержание статьи</label>
                        <textarea id="article-content" placeholder="Напишите содержание статьи..." rows="10" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="article-image">Изображение статьи</label>
                        <div class="file-upload">
                            <input type="file" id="article-image" accept="image/*">
                            <label for="article-image" class="file-upload-label">
                                <i class="fas fa-upload"></i> Выбрать изображение
                            </label>
                            <span id="file-name">Файл не выбран</span>
                        </div>
                        <div id="image-preview" class="image-preview"></div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancel-add-btn" class="cancel-btn">Отмена</button>
                        <button type="submit" class="submit-btn">
                            <i class="fas fa-save"></i> Сохранить статью
                        </button>
                    </div>
                </form>
            </div>
        </div>
<!-- Модальное окно редактирования статьи -->
<div id="edit-article-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Редактировать статью</h3>
            <span id="close-edit-modal" class="close">&times;</span>
        </div>
        <form id="edit-article-form" class="modal-form">
            <div class="form-group">
                <label for="edit-article-title">Заголовок статьи</label>
                <input type="text" id="edit-article-title" placeholder="Введите заголовок" required>
            </div>

            <div class="form-group">
                <label for="edit-article-content">Содержание статьи</label>
                <textarea id="edit-article-content" placeholder="Напишите содержание статьи..." rows="10" required></textarea>
            </div>

            <div class="form-group">
                <label for="edit-article-image">Новое изображение статьи (оставьте пустым, чтобы сохранить текущее)</label>
                <div class="file-upload">
                    <input type="file" id="edit-article-image" accept="image/*">
                    <label for="edit-article-image" class="file-upload-label">
                        <i class="fas fa-upload"></i> Выбрать новое изображение
                    </label>
                    <span id="edit-file-name">Файл не выбран</span>
                </div>
                <div id="edit-image-preview" class="image-preview"></div>
            </div>

            <div class="form-actions">
                <button type="button" id="cancel-edit-btn" class="cancel-btn">Отмена</button>
                <button type="submit" class="submit-btn">
                    <i class="fas fa-save"></i> Обновить статью
                </button>
            </div>
        </form>
    </div>
</div>


    </div>

    <!-- Подключаем скрипты -->
    <script src="js/firebase-config.js"></script>
    
    <script>
        // Базовая инициализация
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing admin interface...');
            
            // ===== ФОРМА ВХОДA =====
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    console.log('Login form submitted');
                    
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    
                    if (!email || !password) {
                        alert('Заполните все поля');
                        return;
                    }
                    
                    // Показываем loading state
                    const submitBtn = loginForm.querySelector('.auth-submit-btn');
                    const originalText = submitBtn.innerHTML;
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Вход...';
                    
                    // Вызываем глобальную функцию для входа
                    if (window.handleLogin) {
                        window.handleLogin(email, password)
                            .finally(() => {
                                submitBtn.disabled = false;
                                submitBtn.innerHTML = originalText;
                            });
                    } else {
                        alert('Система входа не инициализирована');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalText;
                    }
                });
            }

            // ===== МОДАЛЬНОЕ ОКНО СТАТЬИ =====
            const addArticleBtn = document.getElementById('add-article-btn');
            const addArticleModal = document.getElementById('add-article-modal');
            const closeAddModal = document.getElementById('close-add-modal');
            const cancelAddBtn = document.getElementById('cancel-add-btn');
            const fileInput = document.getElementById('article-image');
            const fileName = document.getElementById('file-name');
            const imagePreview = document.getElementById('image-preview');

            // Функции для работы с модальными окнами
            function openAddArticleModal() {
                if (addArticleModal) {
                    addArticleModal.style.display = 'block';
                    resetForm();
                }
            }

            function closeAddArticleModal() {
                if (addArticleModal) {
                    addArticleModal.style.display = 'none';
                    resetForm();
                }
            }

            function resetForm() {
                const addArticleForm = document.getElementById('add-article-form');
                if (addArticleForm) addArticleForm.reset();
                if (fileName) fileName.textContent = 'Файл не выбран';
                if (imagePreview) {
                    imagePreview.style.display = 'none';
                    imagePreview.innerHTML = '';
                }
            }

            function handleFileSelect(e) {
                const file = e.target.files[0];
                if (file && fileName) {
                    fileName.textContent = file.name;
                    
                    if (file.type.startsWith('image/') && imagePreview) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            imagePreview.innerHTML = `<img src="${e.target.result}" alt="Превью">`;
                            imagePreview.style.display = 'block';
                        };
                        reader.readAsDataURL(file);
                    }
                } else if (fileName) {
                    fileName.textContent = 'Файл не выбран';
                    if (imagePreview) imagePreview.style.display = 'none';
                }
            }

            // Обработчики событий
            if (addArticleBtn) {
                addArticleBtn.addEventListener('click', openAddArticleModal);
            }

            if (closeAddModal) {
                closeAddModal.addEventListener('click', closeAddArticleModal);
            }

            if (cancelAddBtn) {
                cancelAddBtn.addEventListener('click', closeAddArticleModal);
            }

            if (fileInput) {
                fileInput.addEventListener('change', handleFileSelect);
            }

            // Закрытие по клику вне окна
            window.addEventListener('click', function(event) {
                if (event.target === addArticleModal) {
                    closeAddArticleModal();
                }
            });

            // Делаем функции глобальными
            window.openAddArticleModal = openAddArticleModal;
            window.closeAddArticleModal = closeAddArticleModal;

            console.log('Admin interface initialized successfully');
        });
    </script>

    <!-- Подключаем основной скрипт -->
    <script src="js/admin.js"></script>
</body>
</html>
