<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Админка блога CO[D]ENT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
</head>
<body>
    <!-- Контейнер аутентификации -->
    <div id="auth-container">
        <div class="auth-wrapper">
            <div class="auth-logo">
                <h2>CO[D]ENT</h2>
                <p>Панель управления блогом</p>
            </div>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="admin@codent.pro" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Введите пароль" required>
                </div>
                <button type="submit" class="auth-submit-btn">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </button>
            </form>
        </div>
    </div>

    <!-- Основная панель администрирования -->
    <div id="admin-container" style="display:none;">
        <header class="admin-header">
            <div class="admin-header-content">
                <div class="admin-title">
                    <h1><i class="fas fa-cog"></i> Панель управления блогом</h1>
                    <p>Управление статьями и контентом</p>
                </div>
                <div class="admin-actions">
                    <button id="logout-btn" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Выйти
                    </button>
                </div>
            </div>
        </header>

        <main class="admin-main">
            <div class="admin-toolbar">
                <button id="add-article-btn" class="add-article-btn">
                    <i class="fas fa-plus"></i> Новая статья
                </button>
                <div class="stats">
                    <span class="stat-item">
                        <i class="fas fa-file-alt"></i> Статей: <span id="articles-count">0</span>
                    </span>
                </div>
            </div>

            <div class="articles-container">
                <h2>Список статей</h2>
                <div id="articles-list" class="articles-grid">
                    <div class="loading-articles">Загрузка статей...</div>
                </div>
            </div>
        </main>

        <!-- Модальное окно добавления статьи -->
        <div id="add-article-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal" id="close-add-modal">&times;</span>
                <h2><i class="fas fa-plus"></i> Добавить новую статью</h2>
                
                <form id="add-article-form" class="article-form">
                    <div class="form-group">
                        <label for="article-title">Название статьи *</label>
                        <input type="text" id="article-title" required placeholder="Введите заголовок статьи">
                        <span class="error-message"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="article-content">Содержание статьи *</label>
                        <textarea id="article-content" required placeholder="Напишите содержание статьи..." rows="8"></textarea>
                        <span class="error-message"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="article-image">Изображение статьи</label>
                        <div class="file-upload">
                            <input type="file" id="article-image" accept="image/*">
                            <label for="article-image" class="file-label">
                                <i class="fas fa-upload"></i> Выберите изображение
                            </label>
                            <span class="file-name" id="file-name">Файл не выбран</span>
                        </div>
                        <div id="image-preview" class="image-preview"></div>
                        <span class="file-hint">Поддерживаемые форматы: JPG, PNG, GIF. Макс. размер: 5MB</span>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="cancel-btn" id="cancel-add-btn">
                            <i class="fas fa-times"></i> Отмена
                        </button>
                        <button type="submit" class="submit-btn">
                            <i class="fas fa-save"></i> Сохранить статью
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Подключаем скрипты -->
    <script src="js/firebase-config.js"></script>
    
    <script>
        // Базовая инициализация модальных окон
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing admin interface...');
            
            // Основные элементы
            const addArticleBtn = document.getElementById('add-article-btn');
            const addArticleModal = document.getElementById('add-article-modal');
            const closeAddModal = document.getElementById('close-add-modal');
            const cancelAddBtn = document.getElementById('cancel-add-btn');
            const addArticleForm = document.getElementById('add-article-form');
            const fileInput = document.getElementById('article-image');
            const fileName = document.getElementById('file-name');
            const imagePreview = document.getElementById('image-preview');

            // Проверяем существование элементов
            if (!addArticleBtn) {
                console.error('Кнопка "Новая статья" не найдена');
                return;
            }

            if (!addArticleModal) {
                console.error('Модальное окно не найдено');
                return;
            }

            // Функции для работы с модальными окнами
            function openAddArticleModal() {
                console.log('Opening add article modal');
                addArticleModal.style.display = 'block';
                resetForm();
            }

            function closeAddArticleModal() {
                addArticleModal.style.display = 'none';
                resetForm();
            }

            function resetForm() {
                if (addArticleForm) {
                    addArticleForm.reset();
                }
                if (fileName) {
                    fileName.textContent = 'Файл не выбран';
                }
                if (imagePreview) {
                    imagePreview.style.display = 'none';
                    imagePreview.innerHTML = '';
                }
            }

            function handleFileSelect(e) {
                const file = e.target.files[0];
                if (file && fileName) {
                    fileName.textContent = file.name;
                    
                    // Превью изображения
                    if (file.type.startsWith('image/') && imagePreview) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            imagePreview.innerHTML = `<img src="${e.target.result}" alt="Превью" style="max-width: 100%; max-height: 200px;">`;
                            imagePreview.style.display = 'block';
                        };
                        reader.readAsDataURL(file);
                    }
                } else if (fileName) {
                    fileName.textContent = 'Файл не выбран';
                    if (imagePreview) {
                        imagePreview.style.display = 'none';
                    }
                }
            }

            // Обработчики событий
            addArticleBtn.addEventListener('click', openAddArticleModal);

            if (closeAddModal) {
                closeAddModal.addEventListener('click', closeAddArticleModal);
            }

            if (cancelAddBtn) {
                cancelAddBtn.addEventListener('click', closeAddArticleModal);
            }

            if (fileInput) {
                fileInput.addEventListener('change', handleFileSelect);
            }

            // Закрытие по клику вне окна
            window.addEventListener('click', function(event) {
                if (event.target === addArticleModal) {
                    closeAddArticleModal();
                }
            });

            // Делаем функции глобальными для использования в admin.js
            window.openAddArticleModal = openAddArticleModal;
            window.closeAddArticleModal = closeAddArticleModal;

            console.log('Admin interface initialized successfully');
        });
    </script>

    <!-- Подключаем основной скрипт после инициализации -->
    <script src="js/admin.js"></script>

    <script>
        // Резервная инициализация на случай если что-то пошло не так
        setTimeout(() => {
            const addArticleBtn = document.getElementById('add-article-btn');
            const addArticleModal = document.getElementById('add-article-modal');
            
            if (addArticleBtn && addArticleModal && !addArticleBtn.onclick) {
                addArticleBtn.addEventListener('click', () => {
                    addArticleModal.style.display = 'block';
                });
                console.log('Резервная инициализация кнопки выполнена');
            }
        }, 2000);
    </script>
</body>
</html>
