<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CODENT - Фотополимеры</title> <!-- Исправлен заголовок -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/catalog.css">
    <!-- Подключаем конфиг -->
    <script src="js/sheet-config.js"></script>
</head>
<body>
    <div id="page-header" class="page-header"></div>
    <div id="products-container" class="products-grid">
        <div class="loading">Загружаем каталог фотополимеров...</div>
    </div>
    
    <script src="js/load-components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Устанавливаем заголовок страницы через конфиг
            window.sheetConfig.setPageTitle();
            
            // Загружаем дополнительные компоненты
            loadComponent('includes/help-button.html', 'body');
            
            // Загрузка данных из Google Sheets
            loadProducts();
        });
        
        function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '<div class="loading">Загружаем данные о товарах...</div>';
            
            // Получаем URL из конфига (gid=324737883 для фотополимеров)
            const sheetUrl = window.sheetConfig.getExportUrl();
            console.log('Загружаем данные по URL:', sheetUrl);
            
            // Добавляем timestamp для избежания кэширования
            const finalUrl = sheetUrl + '&t=' + new Date().getTime();
            
            fetch(finalUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Ошибка сети: ' + response.status);
                    return response.text();
                })
                .then(data => {
                    console.log('Получены сырые данные:', data);
                    const products = parseCSV(data);
                    console.log('Распарсенные товары:', products);
                    
                    if (products.length > 0) {
                        renderProducts(products);
                    } else {
                        showError('Нет товаров для отображения. Проверьте данные в таблице.');
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки:', error);
                    showError('Не удалось загрузить данные. Пожалуйста, попробуйте позже.');
                });
        }
        
        function parseCSV(csvText) {
            // Удаляем BOM символ если есть
            if (csvText.charCodeAt(0) === 0xFEFF) {
                csvText = csvText.substring(1);
            }
            
            const lines = csvText.split('\r\n').filter(line => line.trim().length > 0);
            
            if (lines.length < 2) {
                console.warn('CSV содержит менее 2 строк (заголовок + данные)');
                return [];
            }
            
            // Улучшенный парсинг заголовков
            const headers = lines[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                .map(header => header.trim().toLowerCase().replace(/"/g, ''));
            console.log('Заголовки:', headers);
            
            const products = [];
            
            // Обрабатываем строки данных
            for (let i = 1; i < lines.length; i++) {
                try {
                    // Улучшенный парсинг строк с учетом кавычек
                    const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                        .map(val => val.trim().replace(/^"(.*)"$/, '$1'));
                    
                    const product = {};
                    let hasData = false;
                    
                    for (let j = 0; j < headers.length; j++) {
                        const value = j < values.length ? values[j] : '';
                        product[headers[j]] = value;
                        if (value) hasData = true;
                    }
                    
                    // Добавляем товар, если есть название
                    if (hasData && product['наименование']) {
                        // Дополнительная обработка для фотополимеров
                        if (product['цвет']) {
                            product['наименование'] += ' (' + product['цвет'] + ')';
                        }
                        products.push(product);
                    }
                } catch (e) {
                    console.error('Ошибка парсинга строки', i, ':', lines[i], e);
                }
            }
            
            return products;
        }
        
        function renderProducts(products) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            products.forEach(product => {
                const name = product['наименование'] || 'Без названия';
                let price = product['цена'] || '';
                const promoPrice = product['акционная цена'] || product['аукционная цена'] || '';
                const volume = product['объем'] || product['вес'] || '';
                
                // Форматируем цену
                let priceHtml = '';
                if (price) {
                    price = price.replace(/[^0-9]/g, '');
                    if (price) {
                        price = parseInt(price).toLocaleString('ru-RU') + ' ₽';
                        
                        if (promoPrice) {
                            const cleanPromoPrice = promoPrice.replace(/[^0-9]/g, '');
                            if (cleanPromoPrice) {
                                priceHtml = `
                                    <div class="product-price">
                                        <span class="product-old-price">${price}</span>
                                        ${parseInt(cleanPromoPrice).toLocaleString('ru-RU')} ₽
                                    </div>
                                `;
                            }
                        } else {
                            priceHtml = `<div class="product-price">${price}</div>`;
                        }
                    }
                }
                
                if (!priceHtml) {
                    priceHtml = '<div class="product-price">Цена по запросу</div>';
                }
                
                // Дополнительная информация для фотополимеров
                let detailsHtml = '';
                if (volume) {
                    detailsHtml = `<div class="product-volume">${volume}</div>`;
                }
                
                // Создаем карточку товара
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-name">${name}</div>
                    ${detailsHtml}
                    ${priceHtml}
                `;
                
                container.appendChild(card);
            });
            
            if (container.children.length === 0) {
                showError('Нет товаров для отображения');
            }
        }
        
        function showError(message) {
            const container = document.getElementById('products-container');
            container.innerHTML = `
                <div class="error">${message}</div>
                <button class="retry-button" onclick="loadProducts()">Попробовать снова</button>
            `;
        }
    </script>
    <style>
        .retry-button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .retry-button:hover {
            background: #3367d6;
        }
        .product-volume {
            color: #666;
            font-size: 0.9em;
            margin: 5px 0;
        }
    </style>
</body>
</html>
