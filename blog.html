<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CO[D]ENT - Блог</title>
    <meta name="description" content="Блог CO[D]ENT">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="src/codent-logo-light.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/blog.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
</head>
<body>
    <!-- Хедер будет загружен динамически -->
    
    <!-- Основной контент блога -->
    <main class="main-content-wrapper">
        <div class="blog-container" id="article-container">
            <div class="loading">Загрузка блога...</div>
        </div>
    </main>

    <!-- Футер и кнопка помощи загружаются автоматически через load-components.js -->

    <!-- Подключаем скрипты в правильном порядке -->
    <script src="js/load-components.js"></script>
    <script src="js/api-keys.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/blog.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Загружаем только хедер (футер загружается автоматически через load-components.js)
            loadComponent('header.html', '#page-header');
            
            // Заголовок будет устанавливаться динамически в blog.js
            
            // Добавляем отступ при загрузке хедера
            const checkHeader = setInterval(() => {
                const header = document.querySelector('header');
                if (header) {
                    clearInterval(checkHeader);
                    document.documentElement.style.setProperty(
                        '--header-height', 
                        `${header.offsetHeight}px`
                    );
                }
            }, 100);
            
            // Инициализация мобильного меню
            const initMenu = setInterval(() => {
                const menuBtn = document.querySelector('.mobile-menu-btn');
                const navMenu = document.querySelector('.nav');
                
                if (menuBtn && navMenu) {
                    clearInterval(initMenu);
                    
                    menuBtn.addEventListener('click', () => {
                        navMenu.classList.toggle('active');
                    });
                    
                    document.addEventListener('click', (e) => {
                        if (!e.target.closest('.nav') && !e.target.closest('.mobile-menu-btn')) {
                            navMenu.classList.remove('active');
                        }
                    });
                }
            }, 100);
        });
    </script>
</body>
</html>
