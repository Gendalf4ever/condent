<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CODENT - 3D Сканеры</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/catalog.css">
    <!-- Подключаем конфиг -->
    <script src="js/sheet-config.js"></script>
    <style>
        /* Стили для модального окна */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            overflow-y: auto;
        }
        .modal-content {
            background-color: #fff;
            margin: 30px auto;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .close-modal {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }
        .close-modal:hover {
            color: #333;
        }
        .modal-header {
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        .modal-body {
            display: flex;
            flex-wrap: wrap;
        }
        .product-image-container {
            flex: 0 0 40%;
            padding-right: 20px;
        }
        .product-info {
            flex: 0 0 60%;
        }
        .product-image {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .product-price-container {
            margin: 15px 0;
            font-size: 1.2em;
        }
        .product-old-price {
            text-decoration: line-through;
            color: #999;
            margin-right: 10px;
        }
        .product-description {
            margin: 20px 0;
            line-height: 1.6;
        }
        .specs-list {
            margin-top: 20px;
        }
        .spec-item {
            margin-bottom: 8px;
            display: flex;
        }
        .spec-name {
            font-weight: bold;
            min-width: 200px;
        }
        .spec-value {
            flex: 1;
            white-space: pre-line;
        }
        
        /* Адаптация для мобильных */
        @media (max-width: 768px) {
            .modal-body {
                flex-direction: column;
            }
            .product-image-container,
            .product-info {
                flex: 0 0 100%;
                padding-right: 0;
            }
            .product-image-container {
                margin-bottom: 20px;
            }
            .spec-name {
                min-width: 150px;
            }
        }
        .retry-button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .retry-button:hover {
            background: #3367d6;
        }
    </style>
</head>
<body>
    <div id="page-header" class="page-header"></div>
    <div id="products-container" class="products-grid">
        <div class="loading">Загружаем каталог 3D сканеров...</div>
    </div>

    <!-- Модальное окно для описания товара -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <h2 id="modal-product-name"></h2>
            </div>
            <div class="modal-body">
                <div class="product-image-container">
                    <img id="modal-product-image" class="product-image" src="" alt="">
                </div>
                <div class="product-info">
                    <div class="product-price-container" id="modal-product-price"></div>
                    <div class="product-description" id="modal-product-description"></div>
                    <div class="specs-list" id="modal-product-specs"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/load-components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Устанавливаем заголовок страницы через конфиг
            window.sheetConfig.setPageTitle();
            
            // Загружаем дополнительные компоненты
            loadComponent('includes/help-button.html', 'body');
            
            // Загрузка данных из Google Sheets
            loadProducts();
            
            // Закрытие модального окна
            document.querySelector('.close-modal').onclick = function() {
                document.getElementById('productModal').style.display = 'none';
            }
            
            // Закрытие при клике вне окна
            window.onclick = function(event) {
                if (event.target == document.getElementById('productModal')) {
                    document.getElementById('productModal').style.display = 'none';
                }
            }
        });
        
        function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '<div class="loading">Загружаем данные о товарах...</div>';
            
            // Получаем URL из конфига (gid=784720976 для 3D сканеров)
            const sheetUrl = window.sheetConfig.getExportUrl();
            console.log('Загружаем данные по URL:', sheetUrl);
            
            fetch(sheetUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Ошибка сети: ' + response.status);
                    return response.text();
                })
                .then(data => {
                    console.log('Получены сырые данные:', data);
                    const products = parseCSV(data);
                    console.log('Распарсенные товары:', products);
                    
                    if (products.length > 0) {
                        renderProducts(products);
                    } else {
                        showError('Нет товаров для отображения. Проверьте данные в таблице.');
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки:', error);
                    showError('Не удалось загрузить данные. Пожалуйста, попробуйте позже.');
                });
        }
        
        function parseCSV(csvText) {
            // Удаляем BOM символ если есть
            if (csvText.charCodeAt(0) === 0xFEFF) {
                csvText = csvText.substring(1);
            }
            
            const lines = [];
            let currentLine = '';
            let inQuotes = false;
            
            // Обрабатываем текст с учетом многострочных значений в кавычках
            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === '\n' && !inQuotes) {
                    lines.push(currentLine.trim());
                    currentLine = '';
                    continue;
                }
                
                currentLine += char;
            }
            lines.push(currentLine.trim());
            
            if (lines.length < 2) return [];
            
            // Получаем заголовки
            const headers = lines[0].split(',')
                .map(header => header.trim().toLowerCase());
            
            const products = [];
            
            // Обрабатываем строки данных
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());
                
                const product = {};
                
                // Сопоставляем значения с заголовками
                for (let j = 0; j < headers.length; j++) {
                    if (j < values.length) {
                        let value = values[j];
                        // Удаляем окружающие кавычки если есть
                        if (value.startsWith('"') && value.endsWith('"')) {
                            value = value.slice(1, -1);
                        }
                        product[headers[j]] = value;
                    } else {
                        product[headers[j]] = '';
                    }
                }
                
                // Очищаем цену от лишних символов
                if (product['цена']) {
                    product['цена'] = product['цена'].replace(/[^0-9]/g, '');
                }
                if (product['акционная цена']) {
                    product['акционная цена'] = product['акционная цена'].replace(/[^0-9]/g, '');
                }
                
                // Добавляем только если есть название и цена
                if (product['наименование'] && product['цена']) {
                    products.push(product);
                }
            }
            
            return products;
        }
        
        function renderProducts(products) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            products.forEach(product => {
                const name = product['наименование'] || 'Без названия';
                const price = product['цена'] || '';
                const promoPrice = product['акционная цена'] || '';
                const imageUrl = product['изображение'] || '';
                
                // Форматируем цену
                let priceHtml = '';
                if (price) {
                    const formattedPrice = parseInt(price).toLocaleString('ru-RU') + ' ₽';
                    
                    if (promoPrice) {
                        const formattedPromoPrice = parseInt(promoPrice).toLocaleString('ru-RU') + ' ₽';
                        priceHtml = `
                            <div class="product-price">
                                <span class="product-old-price">${formattedPrice}</span>
                                ${formattedPromoPrice}
                            </div>
                        `;
                    } else {
                        priceHtml = `<div class="product-price">${formattedPrice}</div>`;
                    }
                } else {
                    priceHtml = '<div class="product-price">Цена по запросу</div>';
                }
                
                // Создаем карточку товара
                const card = document.createElement('div');
                card.className = 'product-card';
                
                // Добавляем превью изображения если есть
                let imageHtml = '';
                if (imageUrl) {
                    imageHtml = `<img src="${imageUrl}" alt="${name}" class="product-thumbnail" loading="lazy">`;
                }
                
                card.innerHTML = `
                    ${imageHtml}
                    <div class="product-name">${name}</div>
                    ${priceHtml}
                `;
                
                // Добавляем обработчик клика для открытия модального окна
                card.addEventListener('click', function() {
                    openProductModal(product);
                });
                
                container.appendChild(card);
            });
            
            if (container.children.length === 0) {
                showError('Нет товаров для отображения');
            }
        }
        
        function openProductModal(product) {
            const modal = document.getElementById('productModal');
            const name = product['наименование'] || 'Без названия';
            const price = product['цена'] || '';
            const promoPrice = product['акционная цена'] || '';
            const description = product['описание'] || 'Описание отсутствует';
            const imageUrl = product['изображение'] || '';
            const specsText = product['характеристики'] || '';
            
            // Устанавливаем название товара
            document.getElementById('modal-product-name').textContent = name;
            
            // Устанавливаем изображение (если есть)
            const productImage = document.getElementById('modal-product-image');
            if (imageUrl) {
                productImage.src = imageUrl;
                productImage.alt = name;
                productImage.style.display = 'block';
            } else {
                productImage.style.display = 'none';
            }
            
            // Форматируем и устанавливаем цену
            const priceContainer = document.getElementById('modal-product-price');
            if (price) {
                const formattedPrice = parseInt(price).toLocaleString('ru-RU') + ' ₽';
                
                if (promoPrice) {
                    const formattedPromoPrice = parseInt(promoPrice).toLocaleString('ru-RU') + ' ₽';
                    priceContainer.innerHTML = `
                        <div class="product-price">
                            <span class="product-old-price">${formattedPrice}</span>
                            ${formattedPromoPrice}
                        </div>
                    `;
                } else {
                    priceContainer.innerHTML = `<div class="product-price">${formattedPrice}</div>`;
                }
            } else {
                priceContainer.innerHTML = '<div class="product-price">Цена по запросу</div>';
            }
            
            // Устанавливаем описание
            document.getElementById('modal-product-description').textContent = description;
            
            // Парсим и отображаем характеристики
            const specsContainer = document.getElementById('modal-product-specs');
            specsContainer.innerHTML = '';
            
            if (specsText) {
                // Разбиваем характеристики по строкам
                const specs = specsText.split('\n').filter(spec => spec.trim() !== '');
                
                specs.forEach(spec => {
                    // Разделяем название и значение характеристики
                    const specParts = spec.split(':').map(part => part.trim());
                    const specName = specParts[0];
                    const specValue = specParts.slice(1).join(': ');
                    
                    if (specName && specValue) {
                        const specItem = document.createElement('div');
                        specItem.className = 'spec-item';
                        specItem.innerHTML = `
                            <div class="spec-name">${specName}:</div>
                            <div class="spec-value">${specValue}</div>
                        `;
                        specsContainer.appendChild(specItem);
                    }
                });
            }
            
            // Показываем модальное окно
            modal.style.display = 'block';
        }
        
        function showError(message) {
            const container = document.getElementById('products-container');
            container.innerHTML = `
                <div class="error">${message}</div>
                <button class="retry-button" onclick="loadProducts()">Попробовать снова</button>
            `;
        }
    </script>
</body>
</html>
