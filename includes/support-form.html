<!-- Попап окно для формы обратной связи -->
<div id="contact-popup" class="popup-overlay">
    <div class="popup-content fullscreen-popup">
        <!-- Кнопка закрытия -->
        <button class="popup-close-btn" aria-label="Закрыть окно">
            <i class="fas fa-times"></i>
        </button>

        <div class="popup-header">
            <h2>Связаться с нами</h2>
            <p>Мы ответим в ближайшее время и проконсультируем</p>
        </div>

        <form class="contact-form" id="contact-form-popup">
            <div class="form-group">
                <label for="popup-name">Имя</label>
                <input type="text" id="popup-name" name="name" required>
            </div>

            <div class="form-group">
                <label for="popup-phone">Телефон *</label>
                <div class="phone-input-container">
                    <div class="country-code-selector">
                        <button type="button" class="country-code-btn" id="country-code-btn">
                            <span class="country-flag ru-flag"></span>
                            <span class="country-code">+7</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="country-dropdown" id="country-dropdown">
                            <div class="country-option" data-code="7" data-flag="ru">
                                <span class="country-flag ru-flag"></span>
                                <span class="country-code">+7</span>
                            </div>
                            <div class="country-option" data-code="375" data-flag="by">
                                <span class="country-flag by-flag"></span>
                                <span class="country-code">+375</span>
                            </div>
                            <div class="country-option" data-code="77" data-flag="kz">
                                <span class="country-flag kz-flag"></span>
                                <span class="country-code">+7</span>
                            </div>
                            <div class="country-option" data-code="380" data-flag="ua">
                                <span class="country-flag ua-flag"></span>
                                <span class="country-code">+380</span>
                            </div>
                            <div class="country-option" data-code="48" data-flag="pl">
                                <span class="country-flag pl-flag"></span>
                                <span class="country-code">+48</span>
                            </div>
                            <div class="country-option" data-code="1" data-flag="us">
                                <span class="country-flag us-flag"></span>
                                <span class="country-code">+1</span>
                            </div>
                            <div class="country-option" data-code="44" data-flag="gb">
                                <span class="country-flag gb-flag"></span>
                                <span class="country-code">+44</span>
                            </div>
                            <div class="country-option" data-code="49" data-flag="de">
                                <span class="country-flag de-flag"></span>
                                <span class="country-code">+49</span>
                            </div>
                        </div>
                    </div>
                    <input type="tel" id="popup-phone" name="phone" placeholder="(000) 000-00-00" required>
                </div>
            </div>

            <div class="form-group">
                <label for="popup-email">Почта</label>
                <input type="email" id="popup-email" name="email">
            </div>

            <div class="form-group">
                <label for="popup-message">Сообщение</label>
                <textarea id="popup-message" name="message" rows="4" placeholder="Ваш вопрос"></textarea>
            </div>

            <!-- Чекбокс согласия с политикой конфиденциальности -->
            <div class="form-group checkbox-group">
                <input type="checkbox" id="privacy-policy" name="privacy-policy" required>
                <label for="privacy-policy" class="checkbox-label">
                    Я соглашаюсь с 
                    <a href="privacy-policy.html" target="_blank" class="privacy-link">
                        политикой конфиденциальности
                    </a>
                    *
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Отправить</button>
        </form>
    </div>
</div>
