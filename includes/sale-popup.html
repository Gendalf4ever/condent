<!-- Всплывающий popup баннер в стиле чата -->
<div id="sale-popup" class="sale-chat-popup">
    <div class="sale-chat-container">
            <div class="sale-chat-header">
                <div class="sale-chat-title">
                    <h4>🔥 Специальное предложение!</h4>
                </div>
                <div class="sale-chat-controls">
                    <button class="sale-chat-close" id="sale-popup-close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        
        <div class="sale-chat-body">
            <div class="sale-chat-product" id="sale-popup-product">
                <div class="sale-chat-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Подбираем для вас лучшее предложение...</span>
                </div>
            </div>
            
                <div class="sale-chat-actions" id="sale-popup-actions" style="display: none;">
                    <button class="sale-chat-btn" id="sale-popup-view">
                        Посмотреть товар
                    </button>
                    <button class="sale-chat-btn" id="sale-popup-all-sales">
                        Все акции
                    </button>
                </div>
        </div>
        
    </div>
</div>
