<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CO[D]ENT - Образовательная платформа</title>
    <meta name="description" content="Образовательная платформа CO[D]ENT для изучения 3D-печати и цифровой стоматологии">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="src/codent-logo-light.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/popup.css">
</head>
<body>
    <!-- Компоненты будут загружены автоматически через load-components.js -->
    
    <!-- основной контент -->
    <main class="main-content-wrapper">
        <div class="content-main">
            <div class="education-page-content">
                <div class="education-header">
                    <h1>Образовательная платформа</h1>
                    <p>Друзья! Рады Вам сообщить, что мы запустили образовательную платформу, где Вы можете узнать, как работать с 3D-печатью и не только!</p>
                </div>

                <div class="education-content">
                    <div class="education-link-container">
                        <a href="https://gendalf4ever.github.io/codent-education/" target="_blank" class="education-link">
                            Перейти к образовательной платформе
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Подключаем скрипты -->
    <script src="js/load-components.js"></script>
    <script>
        // Дополнительная инициализация для страницы образования
        document.addEventListener('DOMContentLoaded', () => {
            // Установка заголовка для страницы образования
            if (typeof setPageHeader === 'function') {
                setPageHeader('Образовательная платформа', 'Изучайте 3D-печать и цифровую стоматологию');
            }
            
            // Добавляем отступ при загрузке хедера
            const checkHeader = setInterval(() => {
                const header = document.querySelector('header');
                if (header) {
                    clearInterval(checkHeader);
                    document.documentElement.style.setProperty(
                        '--header-height', 
                        `${header.offsetHeight}px`
                    );
                }
            }, 100);
        });
    </script>
</body>
</html>
