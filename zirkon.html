<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CODENT - Циркониевые диски</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/catalog.css">
    <script src="js/sheet-config.js"></script>
</head>
<body>
    <div id="page-header" class="page-header"></div>
    <div id="products-container" class="products-grid">
        <div class="loading">Загружаем каталог циркониевых дисков...</div>
    </div>

    <!-- Кнопка корзины -->
    <div class="cart-button-container">
        <button id="cart-button" class="cart-button">
            <span class="cart-icon">🛒</span>
            <span id="cart-count" class="cart-count">0</span>
        </button>
    </div>

    <!-- Модальное окно товара -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <h2 id="modal-product-name"></h2>
            </div>
            <div class="modal-body">
                <div class="product-image-container">
                    <img id="modal-product-image" class="product-image" src="" alt="">
                </div>
                <div class="product-info">
                    <div class="product-price-container" id="modal-product-price"></div>
                    <div class="product-description" id="modal-product-description"></div>
                    <div class="specs-list" id="modal-product-specs"></div>
                    
                    <div class="product-params">
                        <div class="param-group">
                            <label class="param-label">Высота (мм):</label>
                            <select class="param-select" id="param-height">
                                <option value="">Выберите высоту...</option>
                            </select>
                        </div>
                        
                        <div class="param-group">
                            <label class="param-label">Количество:</label>
                            <input type="number" id="param-quantity" class="param-quantity" min="1" value="1">
                        </div>
                        
                        <button class="add-to-cart">Добавить в корзину</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно корзины -->
    <div id="cartModal" class="modal">
        <div class="modal-content cart-modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <h2>Ваша корзина</h2>
            </div>
            <div class="modal-body">
                <div id="cart-items-container" class="cart-items-container">
                    <div class="empty-cart-message">Ваша корзина пуста</div>
                </div>
                <div class="cart-total">
                    <div class="total-row">
                        <span>Итого:</span>
                        <span id="cart-total-price">0 ₽</span>
                    </div>
                    <button id="checkout-button" class="checkout-button">Оформить заказ</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/load-components.js"></script>
    <script>
        let currentProduct = null;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        document.addEventListener('DOMContentLoaded', function() {
            window.sheetConfig.setPageTitle();
            loadComponent('includes/help-button.html', 'body');
            loadProducts();
            updateCartCount();
            
            // Обработчики модальных окон
            document.querySelectorAll('.close-modal').forEach(btn => {
                btn.onclick = function() {
                    document.getElementById('productModal').style.display = 'none';
                    document.getElementById('cartModal').style.display = 'none';
                };
            });
            
            window.onclick = function(event) {
                if (event.target.classList.contains('modal')) {
                    document.getElementById('productModal').style.display = 'none';
                    document.getElementById('cartModal').style.display = 'none';
                }
            };
            
            // Обработчики корзины
            document.querySelector('.add-to-cart').addEventListener('click', addToCart);
            document.getElementById('cart-button').addEventListener('click', openCartModal);
            document.getElementById('checkout-button').addEventListener('click', checkout);
        });
        
        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
            document.getElementById('cartModal').style.display = 'none';
        }
        
        function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '<div class="loading">Загружаем каталог...</div>';
            
            const sheetUrl = window.sheetConfig.getExportUrl();
            console.log('Загружаем данные по URL:', sheetUrl);
            
            fetch(sheetUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Ошибка загрузки: ' + response.status);
                    return response.text();
                })
                .then(data => {
                    const products = parseCSV(data);
                    if (products.length > 0) {
                        renderProducts(products);
                    } else {
                        showError('Нет данных для отображения. Проверьте таблицу.');
                    }
                })
                .catch(error => {
                    console.error('Ошибка:', error);
                    showError('Не удалось загрузить данные. Пожалуйста, попробуйте позже.');
                });
        }
        
        function parseCSV(csvText) {
            if (csvText.charCodeAt(0) === 0xFEFF) csvText = csvText.substring(1);
            
            const lines = [];
            let currentLine = '';
            let inQuotes = false;
            
            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === '\n' && !inQuotes) {
                    lines.push(currentLine.trim());
                    currentLine = '';
                    continue;
                }
                currentLine += char;
            }
            lines.push(currentLine.trim());
            
            if (lines.length < 2) return [];
            
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const products = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                const product = {};
                
                for (let j = 0; j < headers.length; j++) {
                    let value = j < values.length ? values[j] : '';
                    if (value.startsWith('"') && value.endsWith('"')) value = value.slice(1, -1);
                    product[headers[j]] = value;
                }
                
                if (product['цена']) product['цена'] = product['цена'].replace(/[^0-9]/g, '');
                if (product['акционная цена']) {
                    product['акционная цена'] = product['акционная цена'].replace(/[^0-9]/g, '');
                }
                
                if (product['наименование'] && product['цена']) {
                    products.push(product);
                }
            }
            
            return products;
        }
        
        function parseCSVLine(line) {
            const values = [];
            let current = '';
            let inQuotes = false;
            
            for (let j = 0; j < line.length; j++) {
                const char = line[j];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) {
                    values.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            values.push(current.trim());
            return values;
        }
        
        function renderProducts(products) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const name = product['наименование'] || 'Без названия';
                const price = product['цена'];
                const promoPrice = product['акционная цена'] || '';
                const imageUrl = product['изображение'] || '';
                
                let priceHtml = '';
                if (price) {
                    const formattedPrice = parseInt(price).toLocaleString('ru-RU') + ' ₽';
                    if (promoPrice) {
                        const formattedPromoPrice = parseInt(promoPrice).toLocaleString('ru-RU') + ' ₽';
                        priceHtml = `
                            <div class="product-price">
                                <span class="product-old-price">${formattedPrice}</span>
                                ${formattedPromoPrice}
                            </div>
                        `;
                    } else {
                        priceHtml = `<div class="product-price">${formattedPrice}</div>`;
                    }
                } else {
                    priceHtml = '<div class="product-price">Цена по запросу</div>';
                }
                
                card.innerHTML = `
                    ${imageUrl ? `<img src="${imageUrl}" alt="${name}" class="product-thumbnail" loading="lazy">` : ''}
                    <div class="product-name">${name}</div>
                    ${priceHtml}
                `;
                
                card.addEventListener('click', () => {
                    currentProduct = product;
                    openProductModal(product);
                });
                
                container.appendChild(card);
            });
            
            if (container.children.length === 0) {
                showError('Нет товаров для отображения');
            }
        }
        
        function openProductModal(product) {
            document.getElementById('modal-product-name').textContent = product['наименование'] || 'Без названия';
            
            const imgElement = document.getElementById('modal-product-image');
            if (product['изображение']) {
                imgElement.src = product['изображение'];
                imgElement.alt = product['наименование'];
                imgElement.style.display = 'block';
            } else {
                imgElement.style.display = 'none';
            }
            
            const priceContainer = document.getElementById('modal-product-price');
            if (product['цена']) {
                const formattedPrice = parseInt(product['цена']).toLocaleString('ru-RU') + ' ₽';
                if (product['акционная цена']) {
                    const promoPrice = parseInt(product['акционная цена']).toLocaleString('ru-RU') + ' ₽';
                    priceContainer.innerHTML = `
                        <div class="product-price">
                            <span class="product-old-price">${formattedPrice}</span>
                            ${promoPrice}
                        </div>
                    `;
                } else {
                    priceContainer.innerHTML = `<div class="product-price">${formattedPrice}</div>`;
                }
            } else {
                priceContainer.innerHTML = '<div class="product-price">Цена по запросу</div>';
            }
            
            document.getElementById('modal-product-description').textContent = product['описание'] || 'Описание отсутствует';
            
            const specsContainer = document.getElementById('modal-product-specs');
            specsContainer.innerHTML = '';
            if (product['характеристики']) {
                product['характеристики'].split('\n').forEach(spec => {
                    const [name, value] = spec.split(':').map(s => s.trim());
                    if (name && value) {
                        const specItem = document.createElement('div');
                        specItem.className = 'spec-item';
                        specItem.innerHTML = `
                            <div class="spec-name">${name}:</div>
                            <div class="spec-value">${value}</div>
                        `;
                        specsContainer.appendChild(specItem);
                    }
                });
            }
            
            // Заполняем выпадающий список высот
            fillHeightOptions(product['высота,мм']);
            
            // Сбрасываем количество на 1 при открытии модального окна
            document.getElementById('param-quantity').value = 1;
            
            document.getElementById('productModal').style.display = 'block';
        }
        
        function fillHeightOptions(heightOptions) {
            const select = document.getElementById('param-height');
            select.innerHTML = '<option value="">Выберите высоту...</option>';
            
            if (!heightOptions) {
                console.warn('Варианты высот не найдены');
                return;
            }
            
            // Разбиваем строку по запятым и удаляем пробелы
            const heights = heightOptions.split(',').map(h => h.trim());
            
            // Добавляем варианты в select
            heights.forEach(height => {
                if (height) {
                    const option = document.createElement('option');
                    option.value = height;
                    option.textContent = height + ' мм';
                    select.appendChild(option);
                }
            });
            
            console.log('Загружены варианты высот:', heights);
        }

        function addToCart() {
            if (!currentProduct) return;
            
            const height = document.getElementById('param-height').value;
            const quantity = parseInt(document.getElementById('param-quantity').value) || 1;
            
            if (!height) {
                alert('Пожалуйста, выберите высоту диска');
                return;
            }
            
            // Проверяем, есть ли уже такой товар в корзине
            const existingItemIndex = cart.findIndex(item => 
                item.product['наименование'] === currentProduct['наименование'] && 
                item.selectedHeight === height
            );
            
            if (existingItemIndex !== -1) {
                // Если товар уже есть в корзине, увеличиваем количество
                cart[existingItemIndex].quantity += quantity;
            } else {
                // Если товара нет в корзине, добавляем новый
                const cartItem = {
                    product: currentProduct,
                    selectedHeight: height,
                    quantity: quantity
                };
                cart.push(cartItem);
            }
            
            // Сохраняем корзину в localStorage
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Обновляем счетчик корзины
            updateCartCount();
            
            alert(`Циркониевый диск "${currentProduct['наименование']}" (${height} мм) добавлен в корзину`);
            closeModal();
        }
        
        function openCartModal() {
            renderCartItems();
            document.getElementById('cartModal').style.display = 'block';
        }
        
        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const totalContainer = document.getElementById('cart-total-price');
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart-message">Ваша корзина пуста</div>';
                totalContainer.textContent = '0 ₽';
                return;
            }
            
            container.innerHTML = '';
            let totalPrice = 0;
            
            cart.forEach((item, index) => {
                const price = item.product['акционная цена'] || item.product['цена'];
                const itemPrice = parseInt(price) * item.quantity;
                totalPrice += itemPrice;
                
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div class="cart-item-image">
                        ${item.product['изображение'] ? `<img src="${item.product['изображение']}" alt="${item.product['наименование']}">` : ''}
                    </div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.product['наименование']}</div>
                        <div class="cart-item-height">Высота: ${item.selectedHeight} мм</div>
                        <div class="cart-item-price">${parseInt(price).toLocaleString('ru-RU')} ₽</div>
                    </div>
                    <div class="cart-item-controls">
                        <div class="quantity-controls">
                            <button class="quantity-btn minus" data-index="${index}">-</button>
                            <span class="quantity">${item.quantity}</span>
                            <button class="quantity-btn plus" data-index="${index}">+</button>
                        </div>
                        <button class="remove-item" data-index="${index}">Удалить</button>
                    </div>
                `;
                container.appendChild(cartItem);
            });
            
            // Обновляем общую сумму
            totalContainer.textContent = totalPrice.toLocaleString('ru-RU') + ' ₽';
            
            // Добавляем обработчики для кнопок
            document.querySelectorAll('.quantity-btn.minus').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    decreaseQuantity(index);
                });
            });
            
            document.querySelectorAll('.quantity-btn.plus').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    increaseQuantity(index);
                });
            });
            
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    removeFromCart(index);
                });
            });
        }
        
        function decreaseQuantity(index) {
            if (cart[index].quantity > 1) {
                cart[index].quantity--;
                updateCart();
            }
        }
        
        function increaseQuantity(index) {
            cart[index].quantity++;
            updateCart();
        }
        
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }
        
        function updateCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            renderCartItems();
            
            // Если корзина пуста, закрываем модальное окно
            if (cart.length === 0) {
                closeModal();
            }
        }
        
        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').textContent = count;
        }
        
        function checkout() {
            if (cart.length === 0) {
                alert('Ваша корзина пуста');
                return;
            }
            
            // Здесь можно добавить логику оформления заказа
            alert('Функционал оформления заказа будет реализован позже');
            
            // Для демонстрации просто очищаем корзину
            // cart = [];
            // localStorage.setItem('cart', JSON.stringify(cart));
            // updateCartCount();
            // renderCartItems();
            // closeModal();
        }
        
        function showError(message) {
            const container = document.getElementById('products-container');
            container.innerHTML = `
                <div class="error">${message}</div>
                <button class="retry-button" onclick="loadProducts()">Попробовать снова</button>
            `;
        }
    </script>
    <style>
     
    </style>
</body>
</html>
